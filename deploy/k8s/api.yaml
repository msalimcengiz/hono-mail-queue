apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-api
  labels: { app: mail, role: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: mail, role: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: mail, role: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/msalimcengiz/hono-mail-queue
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: mail }
            - secretRef: { name: mail-secrets }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: mail-api
spec:
  selector: { app: mail, role: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mail-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: mail-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
